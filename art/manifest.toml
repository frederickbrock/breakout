model = "google/gemini-2.5-flash-image"
prompt_file = "art/prompts/sim-rdl.5.4-r1.txt"
prompt_file_r2 = "art/prompts/sim-rdl.5.4-r2.txt"
prompt_file_r3 = "art/prompts/sim-rdl.5.4-r3.txt"
prompt_file_r4 = "art/prompts/sim-rdl.5.4-r4.txt"

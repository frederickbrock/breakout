[[asset]]
id = "bricks-steelbreak"
issue = "sim-rdl.5.1"
files = [
  "assets/sprites/bricks/ceramic_intact.png",
  "assets/sprites/bricks/ceramic_cracked.png",
  "assets/sprites/bricks/titanium_intact.png",
  "assets/sprites/bricks/titanium_cracked.png",
  "assets/sprites/bricks/tungsten_intact.png",
  "assets/sprites/bricks/tungsten_cracked.png",
  "assets/sprites/bricks/reactor_intact.png",
  "assets/sprites/bricks/reactor_cracked.png",
]
source = "r1/v1 (intact base plate), r3/v2 (cracked base plate)"
model = "google/gemini-2.5-flash-image"
prompt_file = "art/prompts/sim-rdl.5.1-r1.txt"
prompt_file_cracked = "art/prompts/sim-rdl.5.1-r3.txt"
processing = [
  "process round-1/v1.png -> titanium_intact.png --bg flood --tolerance 40 --trim --size 160x60 --fit stretch",
  "process round-3/v2.png -> titanium_cracked.png --bg flood --tolerance 40 --trim --size 160x60 --fit stretch",
  "recolor titanium_intact.png -> ceramic_intact.png --color #ffac90 --strength 1",
  "recolor titanium_cracked.png -> ceramic_cracked.png --color #ffac90 --strength 1",
  "recolor titanium_intact.png -> tungsten_intact.png --color #926630 --strength 1",
  "recolor titanium_cracked.png -> tungsten_cracked.png --color #926630 --strength 1",
  "recolor titanium_intact.png -> reactor_intact.png --color #9579d7 --strength 1",
  "recolor titanium_cracked.png -> reactor_cracked.png --color #9579d7 --strength 1",
]

[[asset]]
id = "ball-paddle-powerup"
issue = "sim-rdl.5.2"
files = [
  "assets/sprites/ball.png",
  "assets/sprites/paddle_prong_left.png",
  "assets/sprites/paddle_prong_right.png",
  "assets/sprites/paddle_field.png",
  "assets/sprites/powerup.png",
]
source = "r1/v3 (ball), r2/v3 (paddle assembly), r3/v2 (power-up icon)"
model = "google/gemini-2.5-flash-image"
prompt_file = "art/prompts/sim-rdl.5.2-r1.txt"
prompt_file_paddle = "art/prompts/sim-rdl.5.2-r2.txt"
prompt_file_powerup = "art/prompts/sim-rdl.5.2-r3.txt"
processing = [
  "process round-1/v3.png -> ball.png --bg flood --tolerance 70 --trim --size 60x60",
  "process round-3/v2.png -> powerup.png --bg flood --tolerance 55 --trim --size 48x48",
  "paddle assembly (round-2/v3.png) manually cropped: left block region -> decontaminate edge colour (push opaque RGB outward to avoid green-spill blend on resize) -> resize 54x40 -> paddle_prong_left.png",
  "paddle_prong_right.png = paddle_prong_left.png mirrored horizontally (true mirrored pair, per acceptance criteria)",
  "paddle_field.png = pure core of the glow bar cropped from round-2/v3.png (no background touching this crop) -> resize 93x40 --fit stretch; fully opaque by design (a solid stretchable fill, not a silhouette sprite)",
]

[[asset]]
id = "hangar-background"
issue = "sim-rdl.5.3"
files = [
  "assets/sprites/hangar_bg.png",
]
source = "r1/v3"
model = "google/gemini-2.5-flash-image"
prompt_file = "art/prompts/sim-rdl.5.3-r1.txt"
processing = [
  "crop round-1/v3.png (0,68)-(1024,955) to remove black letterbox bars (native render was 1024x1024 with a letterboxed 1024x887 scene)",
  "process cropped image -> hangar_bg.png --size 1800x1300 --fit stretch (no bg removal needed; full-scenery render, no key colour)",
  "saved as RGB (opaque, no alpha) with PNG optimize+max compression to fit the 1500KB budget (1412KB)",
  "custom local fix: a soft radial darkening (numpy, ellipse falloff centred on the top-left corner, ~1000x550px radius) applied on top, because the picked render's leftmost ceiling lamp sits inside the ~300x120 game-px HUD text corner and was too bright for white HUD text to read against; verified by compositing simulated white HUD text plus the actual ball/brick sprites at 1x scale on top before finalizing",
]

[[asset]]
id = "brick-outlines"
issue = "sim-rdl.7.5"
files = [
  "assets/sprites/bricks/outline_charge.png",
  "assets/sprites/bricks/outline_breach.png",
  "assets/sprites/bricks/outline_demolition.png",
  "assets/sprites/bricks/outline_regen.png",
  "assets/sprites/bricks/outline_shield.png",
]
source = "charge r1/v2, breach r2/v2, demolition r3/v2, regen r4/v2, shield r5/v2 (reactor outline dropped from scope by the user; keeps the sim-rdl.7.4 coded placeholder)"
model = "google/gemini-2.5-flash-image"
prompt_file = "art/prompts/sim-rdl.7.5-r1.txt"
prompt_file_r2 = "art/prompts/sim-rdl.7.5-r2.txt"
prompt_file_r3 = "art/prompts/sim-rdl.7.5-r3.txt"
prompt_file_r4 = "art/prompts/sim-rdl.7.5-r4.txt"
prompt_file_r5 = "art/prompts/sim-rdl.7.5-r5.txt"
processing = [
  "these are frame/border overlays with a fully enclosed transparent centre (not a solid silhouette like the bricks), so background removal used --bg key (per-pixel colour distance), never --bg flood — flood-fill from the canvas corners can't cross the solid ring to reach the enclosed interior, which would leave it opaque",
  "charge/breach/demolition/shield: process --bg key --key-color <sampled> --tolerance 75 --trim --size 168x68 --fit stretch (green #00FF00 key)",
  "regen: same but --key-color #c71682 --tolerance 100 (magenta #FF00FF key, per the brief's exception) — needed a much higher tolerance than the others because the vine/lattice pattern's thin anti-aliased strokes had magenta spill baked into them throughout (not just at the outer silhouette), which a colour-decontamination pass (pushing opaque RGB outward before resize) could not fix since there was no nearby fully-opaque pixel to source clean colour from inside such thin strokes",
  "tolerance for all 5 tuned up from an initial 40 after finding real, visible background-colour fringe on resize (checked by compositing each on the actual #0a0e15 game background and zooming in) — a naive per-pixel green/magenta detector flagged some of shield's own cyan/teal glow colour as false-positive \"green fringe\"; that one was left alone after visual confirmation it reads clean",
]

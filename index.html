<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Breakout</title>
    <!-- Release builds use the size-tuned `wasm-release` cargo profile and
         binaryen's size optimiser (dev builds skip both). -->
    <link
      data-trunk
      rel="rust"
      data-cargo-profile-release="wasm-release"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals"
    />
    <link data-trunk rel="copy-dir" href="assets" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080b0f; }
      canvas { display: block; width: 100%; height: 100%; outline: none; }
    </style>
  </head>
  <body></body>
</html>

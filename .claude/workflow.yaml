# Agent-team workflow config. Read by pm / coder / reviewer / tester / pr-manager.
# Re-run the workflow-onboard skill to change it.
version: 1
remote: origin
trunk: master                  # default PR base; experiment epics override via base:<branch> label
gates:
  spec_approval: true          # always true
  findings_to_human: false     # reviewer/tester ask the user before bouncing
  approve_before_test: true
  merge: auto                  # human | auto  (master protection: no required review; required checks native + web, test once green)
max_bounces: 2
beads:
  sync_commit: trunk-direct    # trunk-direct | pr | manual  (master is protected but the owner may push; CI skips .beads-only pushes)
stacks: [stack-rust-bevy]
checks:                        # coder must pass all before opening/updating a PR
  - cargo build
  - cargo clippy --all-targets -- -D warnings
  - cargo test
  - trunk build
functional:
  setup: []
  run:                         # tester runs these, in order
    - cargo build
    - scripts/native-run.sh --label <issue-id>   # native desktop (X11 via WSLg); never a bare `cargo run`
  # Drive and screenshot ONLY the window id native-run.sh prints (xdotool key/mousemove/click
  # --window <id>, import -window <id>, scripts/window-close.py <id>); never search for a
  # window named plain "Breakout". Exit 75 = display busy (another agent holds it): use
  # --wait <secs> or retry later. How-to: scripts/README.md.
  teardown: []
  acceptance: native           # exercise acceptance criteria in the native window
pr:
  reviewers: [frederickbrock]
  draft_first: true
art:                           # art team (art-pipeline skill); defaults listed there
  backend: openrouter          # openrouter | comfy (concept rounds)
  model: google/gemini-2.5-flash-image   # openrouter model for concept rounds
  alt_models: []
  variations: 4
  max_rounds: 5                # per issue, both backends
  budget_usd: 2.00             # per issue; comfy rounds cost $0
  concepts_dir: art/concepts
  assets_dir: assets
  style_guide: art/style.md
  manifest: art/manifest.toml
  # Default backend per kind of round (user, 2026-10-05, from the sim-4ws.5
  # comparison in art/concepts/_comparison/). The concept-artist picks the
  # kind from the brief; `backend` above is the fallback for anything else.
  backend_by_workflow:
    sprite: openrouter         # plain sprites
    transparent: openrouter    # sprites that need a cut-out (Gemini + artgen process --bg key)
    tile: openrouter           # tiling backgrounds / parallax layers
    ref: comfy                 # "keep this look" variants from a picked or shipped image
  comfy:
    url: http://127.0.0.1:8188
    # Pinned reference for ref_style sprite rounds (user pick, sim-7bu.4): wins over
    # artgen ref-pick's family pick; a brief's ref: line still overrides it.
    # Relative to the main checkout (art/concepts is git-ignored there).
    ref_image: art/concepts/sim-73n.3/round-4/v1.png
    workflow: art/comfy/sprite.json   # default graph for comfy rounds
    workflows:                 # graph per kind when that kind runs on comfy
      sprite: art/comfy/sprite.json
      transparent: art/comfy/transparent.json
      tile: art/comfy/tile_bg.json
      ref: art/comfy/ref_style.json
    variations: 4

name: Build

on:
  push:
    branches: [master]
    # Beads-only commits (the pm's `chore(beads): sync ...` straight to
    # master) don't rebuild or redeploy Pages. PRs are not filtered, so the
    # required checks still run on every PR.
    paths-ignore: ['.beads/**']
  pull_request:
  workflow_dispatch:

# Only one Pages deployment at a time; don't cancel one already in progress.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bevy's audio/input/windowing system libraries on Linux.
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --all-targets -- -D warnings
      # Headless ECS tests on MinimalPlugins; no window needed.
      - run: cargo test
      # The committed agent settings parse, and the Bash guard hook blocks
      # what it should (stdlib Python; see .claude/hooks/).
      - run: python3 -m unittest discover -s .claude/hooks -p 'test_*.py'

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      # Pages serves project sites from /<repo-name>/, so asset URLs need that prefix.
      - run: trunk build --release --public-url "/${{ github.event.repository.name }}/"

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          path: dist/

  # Loads the built site in headless Chromium (software WebGL2) and checks
  # it reaches the menu and starts a level with no console errors, panics or
  # failed requests (scripts/web_smoke.py; known-harmless noise in
  # scripts/web-smoke.allow). Not a required check yet.
  web-smoke:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.55.0-${{ runner.os }}
      - run: uv run --with playwright==1.55.0 playwright install --with-deps chromium
      - run: uv run scripts/web_smoke.py dist --prefix "/${{ github.event.repository.name }}/" --out web-smoke-out
        env:
          CHROMIUM: bundled
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-smoke
          path: web-smoke-out/
          if-no-files-found: warn

  deploy-pages:
    needs: [web, web-smoke]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
